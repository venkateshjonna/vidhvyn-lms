<!DOCTYPE html>
<html>

<head>
    <title>Email Verified</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .card {
            display: inline-block;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #fff;
            background: #4CAF50;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background: #45a049;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1> Verification Successful!</h1>
        <p>Your email has been verified. You can now login.</p>
        <a href="/auth/login">Login</a>
    </div>
</body>

</html>
