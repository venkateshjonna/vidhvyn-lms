<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vidhvyn LMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        .header {
            background-color: #1e293b;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background-color: white;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .buttons button {
            padding: 10px 25px;
            margin: 10px;
            border: none;
            background-color: #1e293b;
            color: white;
            cursor: pointer;
        }

        .buttons .outline {
            background-color: white;
            color: #1e293b;
            border: 2px solid #1e293b;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #1e293b;
            color: white;
        }
        .space{
            height: 350px;
            padding-top: 60px; /* Prevents header from covering the start of content */
            background-color: white;
        }
    </style>
</head>
<body>

<header class="header">
    <h1>Vidhvyn LMS</h1>
    <nav>
        <a href="/">Home</a>
        <a href="#">Courses</a>
        <a href="/auth/login">Login</a>
        <a href="/user/register">Register</a>
    </nav>
</header>

<section class="hero">
    <h2>Learn. Build. Grow.</h2>
    <p>A simple learning management system</p>

    <div class="buttons">
        <button>Get Started</button>
        <button class="outline">View Courses</button>
    </div>
</section>
<div class="space">

</div>
<footer class="footer">
    <p>© 2025 Vidhvyn LMS</p>
</footer>

</body>
</html>
