<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Vidhvyn LMS</title>
  <link rel="stylesheet" href="/css/home.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    /* Specific styles for the registration form */
    .header {
      background-color: #1e293b;
      color: white;
      padding: 1px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }
    .footer {
      text-align: center;
      padding: 15px;
      background-color: #1e293b;
      color: white;
    }
    .space{
      height: 350px;
      padding-top: 60px; /* Prevents header from covering the start of content */
      background-color: white;
    }

    .register-container {
      padding: 50px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
    }

    .form-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }

    .form-card h2 {
      margin-bottom: 25px;
      color: #1e293b;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #64748b;
    }

    .form-group input {
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #1e293b;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #1e293b; /* Matching your home page button */
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.3s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #64748b;
    }

    .login-link a {
      color: #1e293b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header class="header">
  <h1>Vidhvyn LMS</h1>
  <nav>
    <a href="/">Home</a>
    <a href="#">Courses</a>
    <a href="#">Login</a>
    <a href="/user/register">Register</a>
  </nav>
</header>


<main class="register-container">
  <div class="form-card">
    <h2>Create Account</h2>

    <form action="/user/register" method="POST" onsubmit="return validateCaptcha()">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="username" placeholder="John Doe" th:value="${registerDTO.username}" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" th:value="${registerDTO.email}" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobileNumber" placeholder="+1234567890" th:value="${registerDTO.mobileNumber}" required>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dateOfBirth" th:value="${registerDTO.dateOfBirth}" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>


      <div class="form-group">
        <div class="g-recaptcha"
             th:attr="data-sitekey=${recaptchaSiteKey}">
        </div>
      </div>


      <script>
        function validateCaptcha() {
          const response = grecaptcha.getResponse();
          if (response.length === 0) {
            alert("Please verify that you are not a robot.");
            return false;
          }
          return true;
        }
      </script>
      <button type="submit" class="btn-submit">Register</button>

      <div
              th:if="${message}"
              style="margin-bottom:15px; padding:10px; border-radius:5px;
         background:#fee2e2; color:#991b1b; text-align:center;">
        <span th:text="${message}"></span>
      </div>


    </form>

    <p class="login-link">
      Already have an account? <a href="#">Login here</a>
    </p>
    <p class="login-link">
      Verify Your Mail..<a href="/user/resend-verification">Verify email</a>
    </p>
  </div>
</main>

<footer class="footer">
  <p>© 2025 Vidhvyn LMS</p>
</footer>

</body>
</html>
